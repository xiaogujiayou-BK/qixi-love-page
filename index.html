<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>七夕快乐，我的爱人</title>
  <style>
    :root {
      --ink: #fff7fb;
      --muted: rgba(255, 239, 248, .72);
      --soft: rgba(255, 239, 248, .12);
      --line: rgba(255, 215, 229, .26);
      --rose: #ff8fb7;
      --rose-deep: #ff4f8d;
      --gold: #ffd88a;
      --aqua: #98e6ff;
      --night: #080516;
      --violet: #24123c;
      --glass: rgba(18, 12, 31, .58);
      --shadow: 0 24px 70px rgba(0, 0, 0, .48);
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--night);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
      letter-spacing: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100dvh;
    }

    button {
      font: inherit;
      color: inherit;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 16%, rgba(255, 143, 183, .22), transparent 22%),
        radial-gradient(circle at 82% 14%, rgba(152, 230, 255, .16), transparent 20%),
        radial-gradient(circle at 50% 78%, rgba(255, 216, 138, .13), transparent 30%),
        linear-gradient(160deg, #050411 0%, #120a24 46%, #220f24 100%);
    }

    .page::before,
    .page::after {
      content: "";
      position: absolute;
      inset: -20%;
      pointer-events: none;
    }

    .page::before {
      opacity: .82;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, .95) 0 1px, transparent 1.4px),
        radial-gradient(circle, rgba(255, 196, 219, .9) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255, 216, 138, .8) 0 1px, transparent 1.4px),
        radial-gradient(circle, rgba(152, 230, 255, .72) 0 1px, transparent 1.45px);
      background-size: 62px 62px, 88px 88px, 118px 118px, 166px 166px;
      background-position: 0 0, 18px 29px, 44px 17px, 60px 41px;
      animation: starDrift 26s linear infinite;
    }

    .page::after {
      background:
        linear-gradient(115deg, transparent 0 42%, rgba(255, 247, 251, .16) 45%, transparent 49%),
        linear-gradient(55deg, transparent 0 55%, rgba(255, 216, 138, .10) 58%, transparent 62%);
      mix-blend-mode: screen;
      opacity: .42;
      animation: river 12s ease-in-out infinite alternate;
    }

    @keyframes starDrift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-72px, 72px, 0); }
    }

    @keyframes river {
      from { transform: rotate(0deg) translateX(-1.5%); }
      to { transform: rotate(1.5deg) translateX(1.5%); }
    }

    .shooting {
      position: absolute;
      top: var(--top);
      left: var(--left);
      z-index: 1;
      width: 120px;
      height: 1px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(255, 247, 251, .92), transparent);
      filter: drop-shadow(0 0 8px rgba(255, 216, 138, .85));
      opacity: 0;
      transform: rotate(-28deg);
      animation: shooting 7s linear infinite;
      animation-delay: var(--delay);
    }

    @keyframes shooting {
      0%, 72% { opacity: 0; transform: translate3d(0, 0, 0) rotate(-28deg); }
      76% { opacity: 1; }
      88% { opacity: 0; transform: translate3d(-280px, 170px, 0) rotate(-28deg); }
      100% { opacity: 0; }
    }

    .app {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      width: min(100vw, 480px);
      height: 100dvh;
      margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top)) 18px max(16px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: grid;
      gap: 9px;
      padding: 2px 2px 12px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 24px;
      color: var(--muted);
      font-size: 12px;
    }

    .names {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      white-space: nowrap;
    }

    .tiny-heart {
      position: relative;
      width: 12px;
      height: 12px;
      transform: rotate(45deg);
      background: linear-gradient(135deg, var(--rose), var(--gold));
      box-shadow: 0 0 18px rgba(255, 143, 183, .75);
    }

    .tiny-heart::before,
    .tiny-heart::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: inherit;
    }

    .tiny-heart::before { left: -6px; top: 0; }
    .tiny-heart::after { top: -6px; left: 0; }

    h1 {
      margin: 0;
      font-size: clamp(26px, 8vw, 38px);
      line-height: 1.06;
      font-weight: 500;
      text-wrap: balance;
      text-shadow: 0 0 28px rgba(255, 143, 183, .35);
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .stage {
      position: relative;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 28px;
      overflow: hidden;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, .11), rgba(255, 255, 255, .02)),
        rgba(8, 5, 22, .52);
      box-shadow: var(--shadow), inset 0 0 42px rgba(255, 143, 183, .08);
      backdrop-filter: blur(22px);
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 10px;
      z-index: 1;
      border: 1px solid rgba(255, 247, 251, .16);
      border-radius: 22px;
      pointer-events: none;
    }

    .slides {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      opacity: 0;
      transform: scale(1.04);
      transition: opacity .7s ease, transform .85s cubic-bezier(.2, .8, .2, 1);
      pointer-events: none;
    }

    .slide.active {
      z-index: 2;
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .media-wrap {
      position: relative;
      min-height: 0;
      aspect-ratio: var(--media-ratio, 3 / 4);
      margin: 14px 14px 0;
      border-radius: 21px;
      overflow: hidden;
      background: rgba(0, 0, 0, .18);
    }

    .media-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, .05) 46%, rgba(0, 0, 0, .50) 100%),
        radial-gradient(circle at 18% 10%, rgba(255, 255, 255, .18), transparent 28%);
      pointer-events: none;
    }

    .slide img,
    .slide video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .slide video {
      object-fit: contain;
      background: #000;
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      text-align: center;
      color: rgba(255, 247, 251, .78);
      background:
        radial-gradient(circle at 50% 34%, rgba(255, 143, 183, .20), transparent 34%),
        linear-gradient(160deg, rgba(152, 230, 255, .11), rgba(255, 216, 138, .09));
    }

    .placeholder strong {
      display: block;
      margin-bottom: 8px;
      color: var(--ink);
      font-size: 20px;
      font-weight: 500;
    }

    .caption {
      position: relative;
      z-index: 3;
      display: grid;
      gap: 7px;
      padding: 14px 20px 18px;
    }

    .caption-title {
      margin: 0;
      font-size: 19px;
      line-height: 1.3;
      font-weight: 500;
    }

    .caption-text {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .video-tip {
      position: absolute;
      right: 14px;
      bottom: 14px;
      z-index: 4;
      padding: 7px 11px;
      border: 1px solid rgba(255, 247, 251, .18);
      border-radius: 999px;
      background: rgba(0, 0, 0, .36);
      color: var(--ink);
      font-size: 12px;
      backdrop-filter: blur(12px);
    }

    .progress {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 120px;
      z-index: 5;
      height: 2px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 247, 251, .14);
    }

    .progress span {
      display: block;
      width: var(--progress, 0%);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--aqua), var(--gold), var(--rose));
      box-shadow: 0 0 16px rgba(255, 143, 183, .75);
      transition: width .35s ease;
    }

    .controls {
      display: grid;
      grid-template-columns: 56px 1fr 56px;
      gap: 12px;
      align-items: center;
      padding-top: 13px;
    }

    .control-btn {
      min-height: 52px;
      border: 1px solid rgba(255, 247, 251, .20);
      border-radius: 18px;
      background: rgba(255, 247, 251, .09);
      box-shadow: 0 12px 30px rgba(0, 0, 0, .18);
      cursor: pointer;
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
    }

    .control-btn:active {
      transform: translateY(1px) scale(.98);
    }

    .control-btn:hover,
    .control-btn:focus-visible {
      background: rgba(255, 247, 251, .14);
      border-color: rgba(255, 216, 138, .42);
    }

    .control-btn.primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 18px;
      background: linear-gradient(135deg, rgba(255, 143, 183, .94), rgba(255, 216, 138, .86));
      color: #2a1027;
      border-color: transparent;
      font-weight: 500;
    }

    .arrow {
      display: inline-block;
      font-size: 30px;
      line-height: 1;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 2px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .music {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid rgba(255, 247, 251, .17);
      border-radius: 999px;
      background: rgba(255, 247, 251, .07);
      color: var(--ink);
      cursor: pointer;
    }

    .sound-bars {
      display: inline-flex;
      align-items: end;
      gap: 2px;
      width: 15px;
      height: 14px;
    }

    .sound-bars i {
      width: 3px;
      height: 6px;
      border-radius: 999px;
      background: currentColor;
      opacity: .75;
      animation: beat 1s ease-in-out infinite;
      animation-play-state: paused;
    }

    .sound-bars i:nth-child(2) { height: 11px; animation-delay: .12s; }
    .sound-bars i:nth-child(3) { height: 8px; animation-delay: .24s; }

    .music.playing .sound-bars i {
      animation-play-state: running;
    }

    @keyframes beat {
      0%, 100% { transform: scaleY(.45); }
      50% { transform: scaleY(1); }
    }

    .cover {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 30%, rgba(255, 143, 183, .18), transparent 32%),
        rgba(6, 5, 19, .74);
      backdrop-filter: blur(18px);
      transition: opacity .45s ease, visibility .45s ease;
    }

    .cover.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .cover-inner {
      display: grid;
      gap: 18px;
      width: min(100%, 340px);
      text-align: center;
    }

    .cover-heart {
      position: relative;
      width: 58px;
      height: 58px;
      margin: 0 auto;
      transform: rotate(45deg);
      background: linear-gradient(135deg, var(--rose), var(--gold));
      box-shadow: 0 0 45px rgba(255, 143, 183, .76);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .cover-heart::before,
    .cover-heart::after {
      content: "";
      position: absolute;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: inherit;
    }

    .cover-heart::before { left: -29px; top: 0; }
    .cover-heart::after { left: 0; top: -29px; }

    @keyframes pulse {
      0%, 100% { transform: rotate(45deg) scale(1); }
      50% { transform: rotate(45deg) scale(1.08); }
    }

    .cover h2 {
      margin: 8px 0 0;
      font-size: 30px;
      line-height: 1.2;
      font-weight: 500;
    }

    .cover p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .start-btn {
      min-height: 52px;
      border: 0;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--gold), var(--rose));
      color: #251126;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 18px 42px rgba(255, 143, 183, .24);
    }

    .heart-scene {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      grid-template-rows: 1fr auto;
      align-items: center;
      gap: 6px;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 38%, rgba(255, 143, 183, .22), transparent 42%),
        rgba(8, 5, 22, .22);
      transition: opacity .65s ease, visibility .65s ease;
    }

    .heart-scene.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .heart-field {
      position: relative;
      width: 100%;
      height: min(62dvh, 520px);
      min-height: min(360px, 54dvh);
      align-self: center;
      transform: rotate(180deg);
    }

    .heart-outline {
      position: absolute;
      inset: 2% 1% 0;
      width: 98%;
      height: 98%;
      overflow: visible;
      color: rgba(255, 216, 138, .9);
      filter: drop-shadow(0 0 16px rgba(255, 143, 183, .64));
      opacity: .95;
    }

    .heart-outline path {
      fill: rgba(255, 143, 183, .05);
      stroke: currentColor;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 430;
      stroke-dashoffset: 430;
    }

    .heart-scene.show .heart-outline path {
      animation: drawHeart 1.7s .35s ease forwards;
    }

    @keyframes drawHeart {
      to { stroke-dashoffset: 0; }
    }

    .heart-tile {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--tile, 54px);
      height: var(--tile, 54px);
      box-sizing: border-box;
      overflow: hidden;
      border: 1px solid rgba(255, 247, 251, .28);
      border-radius: 8px;
      background:
        linear-gradient(145deg, rgba(255, 143, 183, .45), rgba(152, 230, 255, .18)),
        rgba(255, 255, 255, .08);
      box-shadow: 0 14px 30px rgba(0, 0, 0, .34), 0 0 20px rgba(255, 143, 183, .18);
      opacity: 0;
      transform: scale(1.08);
    }

    .heart-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: rotate(180deg);
    }

    .heart-tile.is-missing::after {
      content: attr(data-index);
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(255, 247, 251, .86);
      font-size: 15px;
      font-weight: 500;
      transform: rotate(180deg);
    }

    .heart-scene.show .heart-tile {
      animation: settle 1.05s cubic-bezier(.18, .84, .2, 1) forwards;
      animation-delay: var(--delay, 0s);
    }

    @keyframes settle {
      0% {
        opacity: 0;
        transform: scale(1.12);
      }
      35% {
        opacity: 1;
      }
      100% {
        opacity: 1;
        transform: translate(var(--x), var(--y)) scale(1) rotate(var(--r));
      }
    }

    .final-copy {
      position: relative;
      z-index: 2;
      display: grid;
      gap: 12px;
      padding-bottom: 4px;
      text-align: center;
    }

    .final-copy h2 {
      margin: 0;
      font-size: clamp(25px, 7vw, 34px);
      line-height: 1.2;
      font-weight: 500;
      text-shadow: 0 0 28px rgba(255, 143, 183, .45);
    }

    .final-copy p {
      margin: 0 auto;
      max-width: 32em;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .final-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .final-actions button {
      min-height: 42px;
      padding: 0 15px;
      border: 1px solid rgba(255, 247, 251, .20);
      border-radius: 999px;
      background: rgba(255, 247, 251, .09);
      cursor: pointer;
    }

    .final-actions button:first-child {
      background: rgba(255, 216, 138, .18);
      border-color: rgba(255, 216, 138, .38);
    }

    .app.final-mode .topbar,
    .app.final-mode .controls,
    .app.final-mode .footer,
    .app.final-mode .progress {
      opacity: 0;
      pointer-events: none;
    }

    .app.final-mode .slides {
      opacity: 0;
      transform: scale(.95);
      transition: opacity .5s ease, transform .5s ease;
    }

    @media (max-width: 380px) {
      .app {
        padding-left: 12px;
        padding-right: 12px;
      }

      .stage {
        border-radius: 24px;
      }

      .controls {
        grid-template-columns: 50px 1fr 50px;
        gap: 9px;
      }

      .control-btn {
        min-height: 48px;
        border-radius: 16px;
      }

      .control-btn.primary {
        padding: 0 12px;
      }

      .footer {
        gap: 6px;
        font-size: 11px;
      }

      .heart-field {
        min-height: min(330px, 52dvh);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page" aria-label="七夕照片相册">
    <span class="shooting" style="--top: 13%; --left: 88%; --delay: .2s"></span>
    <span class="shooting" style="--top: 27%; --left: 70%; --delay: 3.6s"></span>
    <span class="shooting" style="--top: 8%; --left: 45%; --delay: 5.5s"></span>

    <section class="app" id="app">
      <header class="topbar">
        <div class="eyebrow">
          <span class="names"><span id="personA">我</span><span class="tiny-heart"></span><span id="personB">我的爱人</span></span>
          <span id="daysTogether">第 1 天</span>
        </div>
        <h1 id="pageTitle">七夕快乐，我的爱人</h1>
        <p class="subtitle" id="subtitle">把一张张相遇、靠近和陪伴，慢慢收进同一颗心里。</p>
      </header>

      <section class="stage" id="stage" aria-live="polite">
        <div class="slides" id="slides"></div>
        <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>

        <section class="heart-scene" id="heartScene" aria-label="照片组成的爱心">
          <div class="heart-field" id="heartField">
            <svg class="heart-outline" viewBox="0 0 100 92" aria-hidden="true">
              <path d="M50 83 C 18 58 7 43 12 25 C 17 7 39 8 50 25 C 61 8 83 7 88 25 C 93 43 82 58 50 83 Z"></path>
            </svg>
          </div>
          <div class="final-copy">
            <h2 id="finalTitle">愿每个七夕，都有你在身边</h2>
            <p id="finalText">从第一张照片到最后一颗心，都是我想认真珍藏的你。七夕快乐，我的爱人。</p>
            <div class="final-actions">
              <button type="button" id="replayBtn">从头再看</button>
              <button type="button" id="backBtn">回到最后一张</button>
            </div>
          </div>
        </section>
      </section>

      <nav class="controls" aria-label="相册控制">
        <button class="control-btn" type="button" id="prevBtn" aria-label="上一张"><span class="arrow">‹</span></button>
        <button class="control-btn primary" type="button" id="nextBtn"><span id="nextText">下一张</span></button>
        <button class="control-btn" type="button" id="nextIconBtn" aria-label="下一张"><span class="arrow">›</span></button>
      </nav>

      <footer class="footer">
        <button class="music" type="button" id="musicBtn" aria-label="播放或暂停音乐">
          <span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i></span>
          <span id="musicText">音乐</span>
        </button>
        <span id="counter">1 / 30</span>
      </footer>

      <section class="cover" id="cover">
        <div class="cover-inner">
          <div class="cover-heart" aria-hidden="true"></div>
          <h2>七夕快乐，我的爱人</h2>
          <p>点一下开启音乐和相册。之后可以用按钮、键盘方向键，或在手机上左右滑动。</p>
          <button class="start-btn" type="button" id="startBtn">开启我们的星空</button>
        </div>
      </section>
    </section>

    <audio id="bgm" src="music/解忧邵帅-你是人间四月天.mp3" preload="auto" loop></audio>
  </main>

  <script>
    const CONFIG = {
      title: "七夕快乐，我的爱人",
      subtitle: "把一张张相遇、靠近和陪伴，慢慢收进同一颗心里。",
      personA: "我",
      personB: "我的爱人",
      startDate: "2025-07-22",
      music: "music/解忧邵帅-你是人间四月天.mp3",
      finalTitle: "愿每个七夕，都有你在身边",
      finalText: "从第一张照片到最后一颗心，都是我想认真珍藏的你。七夕快乐，我的爱人。",
      photos: Array.from({ length: 25 }, (_, index) => ({
        type: "photo",
        src: `photos/${pad(index + 1)}.jpg`,
        title: `第 ${index + 1} 张心动`,
        text: [
          "这一刻开始，星光有了偏爱的方向。",
          "想把平凡的日子，过成只有我们懂的浪漫。",
          "你一出现，世界就温柔了一点。",
          "爱不是突然盛大，是每天都想靠近你。",
          "走过的路、看过的云，都因为你变得清晰。",
          "愿我记得你所有明亮又可爱的瞬间。",
          "有你在，连沉默都像一首很轻的歌。",
          "我把喜欢藏在镜头里，也藏在每一次看向你。",
          "我们慢慢来，慢慢爱，慢慢把以后变成现在。",
          "这张照片里，有我想反复确认的幸福。",
          "谢谢你来到我的生活，让日子有了柔软的边。",
          "每一场相遇，都在把我带向你。",
          "我喜欢和你一起，把小事过得闪闪发亮。",
          "你是我想分享黄昏，也想一起等清晨的人。",
          "照片会泛旧，可我喜欢你的心会一直新鲜。",
          "有些答案不用说出口，我看见你就知道。",
          "愿我们的以后，比想象里更温暖一点。",
          "我想成为你疲惫时，也愿意靠近的那束光。",
          "不是七夕才爱你，是七夕刚好适合认真告诉你。",
          "和你在一起的时间，总是偷偷变得很珍贵。",
          "我愿意把未来的很多页，都写上我们的名字。",
          "你不用特别完美，因为你在我这里已经特别好。",
          "我想把温柔留给你，把偏爱也留给你。",
          "愿你抬头有星河，低头有我在身旁。",
          "我珍惜你的开心，也心疼你的不容易。",
          "如果爱有形状，大概就是我们靠近时的样子。",
          "我想和你一起，拥有很多很多个普通又幸福的明天。",
          "越了解你，越觉得遇见你是很好的事。",
          "那些被镜头留下的瞬间，都在替我说想你。",
          "最后，把所有回忆都收成一颗完整的心。",
          "照片会泛旧，可我对你的喜欢不会。",
          "你站在这里，连夜色都像在发光。"
        ][index]
      }))
    };

    const app = document.getElementById("app");
    const cover = document.getElementById("cover");
    const slidesEl = document.getElementById("slides");
    const stage = document.getElementById("stage");
    const heartScene = document.getElementById("heartScene");
    const heartField = document.getElementById("heartField");
    const progressBar = document.getElementById("progressBar");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const nextIconBtn = document.getElementById("nextIconBtn");
    const nextText = document.getElementById("nextText");
    const counter = document.getElementById("counter");
    const startBtn = document.getElementById("startBtn");
    const musicBtn = document.getElementById("musicBtn");
    const musicText = document.getElementById("musicText");
    const bgm = document.getElementById("bgm");
    const replayBtn = document.getElementById("replayBtn");
    const backBtn = document.getElementById("backBtn");

    const media = [...CONFIG.photos];
    const photos = CONFIG.photos;
    let current = 0;
    let isFinal = false;
    let touchStartX = 0;
    let touchStartY = 0;

    function pad(num) {
      return String(num).padStart(2, "0");
    }

    function initText() {
      document.title = CONFIG.title;
      document.getElementById("pageTitle").textContent = CONFIG.title;
      document.getElementById("subtitle").textContent = CONFIG.subtitle;
      document.getElementById("personA").textContent = CONFIG.personA;
      document.getElementById("personB").textContent = CONFIG.personB;
      document.getElementById("finalTitle").textContent = CONFIG.finalTitle;
      document.getElementById("finalText").textContent = CONFIG.finalText;
      bgm.src = CONFIG.music;

      const start = new Date(CONFIG.startDate + "T00:00:00");
      const now = new Date();
      const dayMs = 24 * 60 * 60 * 1000;
      if (!Number.isNaN(start.getTime())) {
        const days = Math.max(1, Math.floor((now - start) / dayMs) + 1);
        document.getElementById("daysTogether").textContent = `相爱第 ${days} 天`;
      }
    }

    function buildSlides() {
      slidesEl.innerHTML = "";
      media.forEach((item, index) => {
        const slide = document.createElement("article");
        slide.className = "slide";
        slide.setAttribute("aria-label", `${index + 1} / ${media.length}`);

        const mediaWrap = document.createElement("div");
        mediaWrap.className = "media-wrap";

        const placeholder = document.createElement("div");
        placeholder.className = "placeholder";
        placeholder.innerHTML = `<span><strong>放入照片 ${pad(index + 1)}</strong>${item.src}</span>`;

        const img = document.createElement("img");
        img.src = item.src;
        img.alt = item.title || `照片 ${index + 1}`;
        img.addEventListener("load", () => placeholder.remove());
        mediaWrap.append(img, placeholder);

        const caption = document.createElement("div");
        caption.className = "caption";
        caption.innerHTML = `<h2 class="caption-title">${item.title || "我们的瞬间"}</h2><p class="caption-text">${item.text || ""}</p>`;

        slide.append(mediaWrap, caption);
        slidesEl.appendChild(slide);
      });
    }

    function updateSlide() {
      const slides = [...slidesEl.children];
      slides.forEach((slide, index) => {
        slide.classList.toggle("active", index === current);
      });
      const total = Math.max(media.length, 1);
      const progress = ((current + 1) / total) * 100;
      progressBar.style.setProperty("--progress", `${progress}%`);
      counter.textContent = `${current + 1} / ${total}`;
      nextText.textContent = current === total - 1 ? "收成爱心" : "下一张";
    }

    function next() {
      if (isFinal) return;
      if (current < media.length - 1) {
        current += 1;
        updateSlide();
      } else {
        showFinal();
      }
    }

    function prev() {
      if (isFinal) {
        hideFinal();
        current = media.length - 1;
        updateSlide();
        return;
      }
      current = Math.max(0, current - 1);
      updateSlide();
    }

    function buildHeart() {
      const existing = heartField.querySelectorAll(".heart-tile");
      existing.forEach(node => node.remove());

      const count = Math.max(photos.length, 1);
      const rect = heartField.getBoundingClientRect();
      const width = Math.max(280, rect.width);
      const height = Math.max(320, rect.height);
      const cols = Math.max(16, Math.floor(width / 30));
      const rows = Math.max(14, Math.floor(height / 28));
      const cell = Math.min(width / cols, height / rows);

      const cells = [];
      for (let row = 0; row < rows; row += 1) {
        for (let col = 0; col < cols; col += 1) {
          const nx = ((col + 0.5) / cols) * 2 - 1;
          const ny = ((row + 0.5) / rows) * 2 - 1;
          const x = nx * 1.08;
          const y = ny * 1.18 + 0.06;
          const inside = Math.pow(x * x + y * y - 1, 3) - x * x * Math.pow(y, 3) <= 0;
          if (inside) cells.push({ col, row });
        }
      }

      if (!cells.length) return;

      const minCol = Math.min(...cells.map(cellPos => cellPos.col));
      const maxCol = Math.max(...cells.map(cellPos => cellPos.col));
      const minRow = Math.min(...cells.map(cellPos => cellPos.row));
      const maxRow = Math.max(...cells.map(cellPos => cellPos.row));
      const heartW = (maxCol - minCol + 1) * cell;
      const heartH = (maxRow - minRow + 1) * cell;
      const offsetX = (width - heartW) / 2;
      const offsetY = (height - heartH) / 2;

      cells.forEach((cellPos, i) => {
        const photo = photos[i % count] || { src: `photos/${pad((i % count) + 1)}.jpg` };
        const tile = document.createElement("div");
        tile.className = "heart-tile";
        tile.style.setProperty("--x", `${offsetX + (cellPos.col - minCol) * cell}px`);
        tile.style.setProperty("--y", `${offsetY + (cellPos.row - minRow) * cell}px`);
        tile.style.setProperty("--r", `${((cellPos.col + cellPos.row) % 3 - 1) * .25}deg`);
        tile.style.setProperty("--delay", `${Math.min(i * .009, .8)}s`);
        tile.style.setProperty("--tile", `${Math.max(24, Math.floor(cell))}px`);
        tile.dataset.index = pad(i + 1);

        const img = document.createElement("img");
        img.src = photo.src;
        img.alt = `爱心照片 ${i + 1}`;
        img.addEventListener("error", () => {
          tile.classList.add("is-missing");
          img.remove();
        });

        tile.appendChild(img);
        heartField.appendChild(tile);
      });
    }

    function showFinal() {
      isFinal = true;
      app.classList.add("final-mode");
      buildHeart();
      requestAnimationFrame(() => heartScene.classList.add("show"));
    }

    function hideFinal() {
      isFinal = false;
      heartScene.classList.remove("show");
      app.classList.remove("final-mode");
    }

    function replay() {
      hideFinal();
      current = 0;
      updateSlide();
    }

    async function startMusic() {
      try {
        await bgm.play();
        musicBtn.classList.add("playing");
        musicText.textContent = "播放中";
      } catch (error) {
        musicBtn.classList.remove("playing");
        musicText.textContent = "点我播放";
      }
    }

    function toggleMusic() {
      if (bgm.paused) {
        startMusic();
      } else {
        bgm.pause();
        musicBtn.classList.remove("playing");
        musicText.textContent = "已暂停";
      }
    }

    function bindEvents() {
      startBtn.addEventListener("click", () => {
        cover.classList.add("hidden");
        startMusic();
      });

      nextBtn.addEventListener("click", next);
      nextIconBtn.addEventListener("click", next);
      prevBtn.addEventListener("click", prev);
      musicBtn.addEventListener("click", toggleMusic);
      replayBtn.addEventListener("click", replay);
      backBtn.addEventListener("click", () => {
        hideFinal();
        current = media.length - 1;
        updateSlide();
      });

      stage.addEventListener("touchstart", event => {
        const first = event.touches[0];
        touchStartX = first.clientX;
        touchStartY = first.clientY;
      }, { passive: true });

      stage.addEventListener("touchend", event => {
        const last = event.changedTouches[0];
        const dx = last.clientX - touchStartX;
        const dy = last.clientY - touchStartY;
        if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          dx < 0 ? next() : prev();
        }
      }, { passive: true });

      window.addEventListener("keydown", event => {
        if (event.key === "ArrowRight" || event.key === " ") next();
        if (event.key === "ArrowLeft") prev();
      });

      window.addEventListener("resize", () => {
        if (isFinal) buildHeart();
      });
    }

    initText();
    buildSlides();
    bindEvents();
    updateSlide();
  </script>
</body>
</html>
